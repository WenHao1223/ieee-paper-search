services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - ./backend/.env
    environment:
      - HEADLESS=1
      - PORT=8000
    volumes:
      - ./backend/pdf:/app/pdf
      - ./backend/browser_profile:/app/browser_profile
      - ./backend/output.json:/app/output.json
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    depends_on:
      - backend
    ports:
      - "8000:80"
    restart: unless-stopped
